---
- name: Set fact nagios_mac_install_base
  ansible.builtin.set_fact:
    nagios_mac_install_base: /usr/local

- name: Set fact nagios_mac_install_base arm64
  ansible.builtin.set_fact:
    nagios_mac_install_base: /opt/homebrew
  when: ansible_facts['architecture'] == "arm64"

# Catalina's brew is pinned, by scripts/bootstrap_mac_earlier_than_14.sh in the
# dronerunner repo: 6.0.22, whose own floor is still 10.15, with homebrew-core
# checked out at a 2022 commit for the sake of the catalina bottles. Brew needs
# telling that, and these are the same variables that script exports.
#
# NO_INSTALL_FROM_API is the one that surfaces as an error: brew otherwise reads
# formulae from formulae.brew.sh, whose per-OS index for an unsupported release
# does not exist, so every command dies on "packages.catalina.jws.json ... HTTP
# status: 404" before doing any work. NO_AUTO_UPDATE stops brew upgrading itself
# to 7.x on the first install, which would leave the host with a brew that
# refuses to start. NO_ASK is for brew 6's habit of prompting to confirm a plan
# that pulls in dependencies.
#
# Empty on every other host. Disabling the API elsewhere would send a current
# brew looking for a homebrew-core clone it has no reason to have.
- name: Set the homebrew environment
  ansible.builtin.set_fact:
    nagios_brew_env: "{{ nagios_brew_env_catalina if ansible_facts['distribution_version'].startswith('10.15') else {} }}"
  vars:
    nagios_brew_env_catalina:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ASK: "1"

- name: Ensure nrpe_group exists
  ansible.builtin.group:
    name: "{{ nrpe_group }}"
    state: present

- name: Ensure nrpe_user exists
  ansible.builtin.user:
    name: "{{ nrpe_user }}"
    shell: /bin/false
    groups: "{{ nrpe_group }}"
    append: true

# test on arm cpu also
- name: Check if brew is installed
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    command -v brew
  args:
    executable: /bin/bash
  register: does_brew_exist
  ignore_errors: true
  changed_when: false

# install.sh calls check_run_command_as_root and aborts with "Don't run this as
# root!", so this cannot inherit the play's become: true. It installs under
# "administrator", who needs passwordless sudo: with NONINTERACTIVE set the
# installer uses "sudo -n" and will not prompt.
- name: Install brew
  ansible.builtin.command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  become: true
  become_user: administrator
  when: does_brew_exist.rc != 0
  changed_when: true

- name: Set fact nrpe_plugin_dir_default
  ansible.builtin.set_fact:
    nrpe_plugin_dir: "{{ nagios_mac_install_base }}/opt/nagios-plugins/libexec/sbin"

# Just ran into this problem. A conflict with prometheus.
# Might solve it another way in the future.
- name: Fix dir permissions  # noqa no-free-form
  ansible.builtin.shell: |
    chmod g+w {{ nagios_mac_install_base }}/var/log
  args:
    executable: /bin/bash
  failed_when: false
  changed_when: false

# brew refuses to run as root, and it is installed under "administrator", so
# these two run as that user rather than as whoever we connected as. This needs
# the connecting user's sudoers entry to permit running as any user, not only
# as root.
#
# Connection user and become_user are both unprivileged here, so Ansible has to
# hand the module file from one to the other. On macOS it does that with an ACL
# ("chmod +a", used since Ansible 2.11) and usually succeeds. If it instead
# reports "Failed to set permissions on the temporary files Ansible needs to
# create when becoming an unprivileged user", turn on pipelining, which skips
# the temporary file altogether: ANSIBLE_PIPELINING=true, or pipelining = True
# under [connection] in ansible.cfg.
- name: Install nagios-plugins
  community.general.homebrew:
    name: nagios-plugins
    state: present
  become: true
  become_user: administrator
  environment: "{{ nagios_brew_env }}"

- name: Install nrpe
  community.general.homebrew:
    name: nrpe
    state: present
  become: true
  become_user: administrator
  environment: "{{ nagios_brew_env }}"

- name: LaunchDaemon config
  ansible.builtin.template:
    src: homebrew.mxcl.nrpe.plist
    dest: /Library/LaunchDaemons/homebrew.mxcl.nrpe.plist
    owner: root
    group: wheel
    mode: "0755"
  notify: Restart nrpe osx

- name: Remove default LaunchDaemon config
  ansible.builtin.file:
    path: /Users/administrator/Library/LaunchAgents/homebrew.mxcl.nrpe.plist
    state: absent

# Install custom plugins here:
# - name: Install check_mem plugin
#  copy: src=files/check_mem dest={{ nrpe_plugin_dir }}/check_mem mode=755

- name: NRPE config file
  ansible.builtin.template:
    src: nrpe.cfg
    dest: "{{ nagios_mac_install_base }}/etc/nrpe.cfg"
    owner: administrator
    group: admin
    mode: "0644"
  notify: Restart nrpe osx

- name: Create nrpe.d dir
  ansible.builtin.file:
    path: "{{ nrpe_conf_dir }}/nrpe.d"
    state: directory
    owner: administrator
    group: admin
    mode: "0755"

- name: NRPE checks
  ansible.builtin.template:
    src: nrpe_check.cfg
    dest: "{{ nrpe_conf_dir }}/nrpe.d/{{ item.key }}.cfg"
    owner: administrator
    group: admin
    mode: "0644"
  with_dict: "{{ nrpe_checks }}"
  notify: Restart nrpe osx

- name: Ensure nrpe is started
  ansible.builtin.command: |
    launchctl load /Library/LaunchDaemons/homebrew.mxcl.nrpe.plist
  changed_when: false
